<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #020617
                );

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            background: rgba(15, 23, 42, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 20px;

            padding: 35px 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: white;
            font-size: 32px;
        }

        .logo p {
            color: #94a3b8;
            margin-top: 6px;
            font-size: 14px;
        }

        .form-group {
            margin-top: 22px;
        }

        label {
            display: block;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;

            padding: 13px 45px 13px 14px;

            border-radius: 10px;

            border: 1px solid #334155;

            outline: none;

            background: #0f172a;

            color: white;

            font-size: 15px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        input::placeholder {
            color: #64748b;
        }

        #togglePassword {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: white;

            cursor: pointer;

            font-size: 18px;
        }

        button[type="submit"] {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button[type="submit"]:hover {
            background: #1d4ed8;
        }

        #message {
            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .logo h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="logo">

            <h1>Login</h1>

            <p>
                Masuk ke akun kamu
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button type="submit">
                Login
            </button>


            <div id="message"></div>


        </form>

    </div>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- SCRIPT WEBSITE -->

    <script src="script.js"></script>


</body>
</html>
