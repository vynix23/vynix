<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | My Website</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f4f6;
        }

        nav {
            height: 70px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8%;
        }

        nav h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            background: #2563eb;

            padding: 10px 18px;
            border-radius: 8px;
        }

        .hero {
            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        .hero-content {
            background: white;
            padding: 50px;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .hero h1 {
            font-size: 40px;
            color: #111827;
            margin-bottom: 15px;
        }

        .hero p {
            color: #6b7280;
            font-size: 18px;
        }

    </style>
</head>

<body>

    <nav>
        <h2>MY WEBSITE</h2>

        <a href="index.html">Logout</a>
    </nav>

    <section class="hero">

        <div class="hero-content">

            <h1>Selamat Datang! 👋</h1>

            <p>
                Kamu berhasil login ke website.
            </p>

        </div>

    </section>

</body>
</html>
