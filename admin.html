<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #0f172a;
            color: white;
        }


        /* ==============================
           SIDEBAR
        ============================== */

        .sidebar {
            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            background: #020617;

            border-right: 1px solid #1e293b;

            padding: 25px 15px;

            z-index: 1000;

            transition: 0.3s;
        }


        .logo {
            text-align: center;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 35px;
        }


        .admin-label {
            text-align: center;

            color: #94a3b8;

            font-size: 13px;

            margin-bottom: 25px;
        }


        .sidebar-menu {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .sidebar-menu button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #0f172a;

            color: white;

            text-align: left;

            cursor: pointer;

            font-size: 14px;
        }


        .sidebar-menu button:hover {
            background: #1e293b;
        }


        .logout-button {
            margin-top: 30px !important;

            background: #7f1d1d !important;
        }


        .logout-button:hover {
            background: #991b1b !important;
        }


        /* ==============================
           MAIN
        ============================== */

        .main {
            margin-left: 250px;

            min-height: 100vh;

            padding: 30px;
        }


        .topbar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 30px;
        }


        .topbar h1 {
            font-size: 28px;
        }


        .topbar p {
            margin-top: 5px;

            color: #94a3b8;

            font-size: 14px;
        }


        .add-button {
            padding: 12px 18px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .add-button:hover {
            background: #1d4ed8;
        }


        /* ==============================
           CARD
        ============================== */

        .card {
            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 25px;
        }


        .card-title {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .card-title h2 {
            font-size: 20px;
        }


        .total {
            color: #94a3b8;

            font-size: 14px;
        }


        /* ==============================
           TABLE
        ============================== */

        .table-container {
            width: 100%;

            overflow-x: auto;
        }


        table {
            width: 100%;

            min-width: 650px;

            border-collapse: collapse;
        }


        th {
            text-align: left;

            padding: 14px;

            background: #0f172a;

            color: #94a3b8;

            font-size: 13px;
        }


        td {
            padding: 14px;

            border-top: 1px solid #1e293b;

            font-size: 14px;
        }


        tr:hover td {
            background: rgba(
                30,
                41,
                59,
                0.5
            );
        }


        /* ==============================
           ACTION BUTTON
        ============================== */

        .action-button {
            border: none;

            border-radius: 7px;

            padding: 7px 11px;

            color: white;

            cursor: pointer;

            margin-right: 5px;

            font-size: 12px;
        }


        .edit-button {
            background: #2563eb;
        }


        .edit-button:hover {
            background: #1d4ed8;
        }


        .delete-button {
            background: #dc2626;
        }


        .delete-button:hover {
            background: #b91c1c;
        }


        /* ==============================
           MODAL
        ============================== */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            background: rgba(
                0,
                0,
                0,
                0.7
            );

            padding: 20px;

            z-index: 2000;
        }


        .modal.show {
            display: flex;
        }


        .modal-content {
            width: 100%;

            max-width: 430px;

            background: #111827;

            border: 1px solid #334155;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.5);
        }


        .modal-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .modal-header h2 {
            font-size: 21px;
        }


        .close-button {
            border: none;

            background: transparent;

            color: #94a3b8;

            font-size: 25px;

            cursor: pointer;
        }


        .close-button:hover {
            color: white;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 13px;
        }


        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            border: 1px solid #334155;

            border-radius: 9px;

            outline: none;

            background: #0f172a;

            color: white;

            font-size: 14px;
        }


        .form-group input:focus,
        .form-group select:focus {
            border-color: #3b82f6;
        }


        .modal-actions {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }


        .modal-actions button {
            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;
        }


        .save-button {
            background: #2563eb;

            color: white;
        }


        .cancel-button {
            background: #334155;

            color: white;
        }


        /* ==============================
           MOBILE BUTTON
        ============================== */

        .menu-button {
            display: none;

            border: none;

            background: #1e293b;

            color: white;

            width: 42px;

            height: 42px;

            border-radius: 9px;

            font-size: 20px;

            cursor: pointer;
        }


        .sidebar-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(
                0,
                0,
                0,
                0.6
            );

            z-index: 900;
        }


        .sidebar-overlay.show {
            display: block;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 768px) {

            .sidebar {
                transform:
                    translateX(-100%);
            }


            .sidebar.open {
                transform:
                    translateX(0);
            }


            .main {
                margin-left: 0;

                padding: 20px 15px;
            }


            .menu-button {
                display: block;
            }


            .topbar {
                align-items: flex-start;
            }


            .topbar-left {
                display: flex;

                align-items: center;

                gap: 12px;
            }


            .topbar h1 {
                font-size: 23px;
            }


            .topbar p {
                font-size: 12px;
            }


            .add-button {
                padding: 10px 13px;

                font-size: 12px;
            }


            .card {
                padding: 15px;

                border-radius: 12px;
            }


            .card-title h2 {
                font-size: 17px;
            }

        }


        @media (max-width: 480px) {

            .topbar {
                flex-direction: column;
            }


            .topbar,
            .topbar-left {
                width: 100%;
            }


            .add-button {
                width: 100%;
            }


            .modal-content {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         OVERLAY
    ============================== -->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
        onclick="closeSidebar()"
    ></div>


    <!-- ==============================
         SIDEBAR
    ============================== -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="logo">
            ADMIN PANEL
        </div>


        <div class="admin-label">
            👑 Administrator
        </div>


        <div class="sidebar-menu">

            <button
                onclick="displayAccounts()"
            >
                👥 Kelola Akun
            </button>


            <button
                onclick="openModal()"
            >
                ➕ Tambah Akun
            </button>


            <button
                class="logout-button"
                onclick="logoutAdmin()"
            >
                🚪 Logout
            </button>

        </div>

    </aside>


    <!-- ==============================
         MAIN
    ============================== -->

    <main class="main">


        <div class="topbar">


            <div class="topbar-left">

                <button
                    class="menu-button"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>


                <div>

                    <h1>
                        Admin Panel
                    </h1>

                    <p>
                        Kelola akun pengguna
                    </p>

                </div>

            </div>


            <button
                class="add-button"
                onclick="openModal()"
            >
                + Tambah Akun
            </button>


        </div>


        <!-- ==========================
             ACCOUNT CARD
        =========================== -->

        <section class="card">


            <div class="card-title">

                <h2>
                    Daftar Akun
                </h2>


                <div class="total">

                    Total:
                    <span id="totalAccounts">
                        0
                    </span>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                Username
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="accountTable"
                    >

                    </tbody>

                </table>

            </div>


        </section>


    </main>


    <!-- ==============================
         MODAL
    ============================== -->

    <div
        id="accountModal"
        class="modal"
    >


        <div class="modal-content">


            <div class="modal-header">

                <h2 id="modalTitle">
                    Tambah Akun
                </h2>


                <button
                    class="close-button"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>


            <form
                id="accountForm"
            >


                <div class="form-group">

                    <label for="newUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="newUsername"
                        placeholder="Masukkan username"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Masukkan password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="newRole">
                        Role
                    </label>

                    <select
                        id="newRole"
                    >

                        <option value="user">
                            👤 User
                        </option>

                        <option value="admin">
                            👑 Admin
                        </option>

                    </select>

                </div>


                <input
                    type="hidden"
                    id="editIndex"
                >


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-button"
                        onclick="closeModal()"
                    >
                        Batal
                    </button>


                    <button
                        type="submit"
                        class="save-button"
                    >
                        Simpan
                    </button>

                </div>


            </form>


        </div>


    </div>


    <!-- ==============================
         SUPABASE
    ============================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ==============================
         SCRIPT WEBSITE
    ============================== -->

    <script src="script.js"></script>


</body>

</html>
